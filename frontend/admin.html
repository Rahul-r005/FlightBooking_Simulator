<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#3157d5">
  <title>Admin — SkyBook</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin-page">
  <header class="navbar">
    <a class="brand" href="/"><img src="/logo.svg" alt="SkyBook"></a>
    <nav><a href="/">Back to booking</a><a href="#" id="signOut">Sign out</a></nav>
  </header>
  <main class="admin-shell">
    <div class="admin-heading">
      <div>
        <p class="eyebrow">ADMINISTRATION</p>
        <h1>SkyBook operations</h1>
        <p class="muted">Manage customer accounts, booking records and cancellations from one protected workspace.</p>
      </div>
    </div>
    <div id="adminStatus" class="status"></div>
    <section class="admin-section">
      <div class="section-heading">
        <div><p class="eyebrow">ACCOUNTS</p><h2>Customer accounts</h2></div>
        <form id="accountSearch" class="inline-form">
          <input id="accountQuery" placeholder="Search name or email">
          <button class="ghost-btn" type="submit">Search</button>
        </form>
      </div>
      <div id="accountList" class="admin-list"></div>
    </section>
    <section class="admin-section">
      <div class="section-heading">
        <div><p class="eyebrow">BOOKINGS</p><h2>Booking operations</h2></div>
        <form id="bookingFilter" class="inline-form">
          <select id="bookingStatus">
            <option value="">All statuses</option>
            <option value="upcoming">Upcoming</option>
            <option value="past">Past</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input id="bookingSearch" placeholder="PNR, name or email">
          <button class="ghost-btn" type="submit">Filter</button>
        </form>
      </div>
      <div id="bookingList" class="admin-list"></div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
