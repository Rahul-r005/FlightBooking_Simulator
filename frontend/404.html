<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#3157d5">
<title>404 — SkyBook</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./style.css">
<style>
  body{min-height:100vh;display:grid;place-items:center}
  .not-found{width:min(720px,92vw);text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:56px 35px;box-shadow:0 18px 55px #1b3d9514}
  .not-found-mark{width:82px;height:82px;margin:0 auto 24px;border-radius:22px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:38px;font-weight:900;box-shadow:0 12px 30px #3157d533}
  .not-found h1{font-size:clamp(58px,10vw,96px);line-height:1;margin:0;color:var(--accent);letter-spacing:-4px}
  .not-found h2{font-size:28px;margin:14px 0 10px}
  .not-found p{max-width:520px;margin:0 auto 28px;color:var(--muted);line-height:1.7}
  .not-found .primary-btn{display:inline-block;text-decoration:none}
</style>
</head>
<body>
<main class="not-found">
  <div class="not-found-mark">✈</div>
  <p class="eyebrow">FLIGHT PATH NOT FOUND</p>
  <h1>404</h1>
  <h2>Looks like you've flown off course.</h2>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back to SkyBook and find your next flight.</p>
  <a class="primary-btn" href="/">Back to SkyBook</a>
</main>
</body>
</html>
