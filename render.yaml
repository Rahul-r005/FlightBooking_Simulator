services:
  - type: web
    name: flightbooking-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn FlightBooking_backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flightbooking-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: flightbooking-db
    plan: free
    region: singapore
    databaseName: flight_booking
    user: flightapp
